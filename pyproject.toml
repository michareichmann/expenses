[project]
name = "expenses"
version = "0.1.0"
description = "A simple Python application for tracking monthly expenses"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "jinja2",
    "pandas",
    "SQLAlchemy",
    "numpy",
    "colored",
    "plotly",
    "ipykernel>=6.29.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expenses"]

[dependency-groups]
dev = []
